# Usage (from the repository root): cp .env.example .env, set the password, then
#   docker compose up -d --build and open http://localhost (or the port set as FRONTEND_PORT in .env)
name: taskmanagement

services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_DB: taskmanagement
      POSTGRES_USER: taskmanagement
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Port is never published
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskmanagement -d taskmanagement"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  backend:
    build: ./backend
    image: taskmanagement-backend:local
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/taskmanagement
      SPRING_DATASOURCE_USERNAME: taskmanagement
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # JSON logs to stdout
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    depends_on:
      postgres:
        condition: service_healthy
    # No published ports: the API is reached through the frontend, Actuator (9000) stays internal
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/actuator/health/liveness"]
      interval: 10s
      timeout: 3s
      retries: 3
      # Long enough that a slow migration is never killed
      start_period: 120s
    labels:
      autoheal: "true"
    restart: unless-stopped
    logging: *logging

  frontend:
    build: ./frontend
    image: taskmanagement-frontend:local
    # nginx serves the app and forwards /api to the backend
    ports:
      - "${FRONTEND_PORT:-80}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 3
    labels:
      autoheal: "true"
    restart: unless-stopped
    logging: *logging

volumes:
  # Never run `docker compose down -v`: it deletes all tasks
  postgres-data:
