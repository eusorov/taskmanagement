spring:
  application:
    name: taskmanagement
  datasource:
    # Keep replicas x maximum-pool-size below Postgres max_connections - ~10
    hikari:
      pool-name: taskmanagement
      maximum-pool-size: 10
  jackson:
    mapper:
      # Reject {"done": "true"} and {"version": "0"}: booleans and numbers must be JSON booleans and numbers
      allow-coercion-of-scalars: false
    deserialization:
      # Reject {"version": 0.7} instead of silently truncating it to 0
      accept-float-as-int: false
      # Reject {"Done": true}: a misspelled field would otherwise be dropped, and the patch succeed without changes
      fail-on-unknown-properties: true
  # Only the dev profile starts compose.dev.yaml; elsewhere the datasource is configured
  docker:
    compose:
      enabled: false
  jooq:
    sql-dialect: postgres

server:
  # use framework because: absolute URLs (Location) use the scheme and host:port that nginx forwards.
  # Not native: Tomcat drops the port of X-Forwarded-Host.
  forward-headers-strategy: framework
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

logging:
  level:
    de.usorov.taskmanagement: INFO
  structured:
    # JSON (ECS) is switched on in compose.yaml; local runs keep plain text
    ecs:
      service:
        # Container hostname, so lines from different replicas can be told apart
        node-name: ${HOSTNAME:local}

# Actuator runs on its own port, which is never routed publicly
management:
  server:
    port: 9000
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-components: always
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState, db

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  paths-to-match: /api/**
  default-produces-media-type: application/json

app:
  demo-tasks:
    # Adds sample tasks on startup when the database is empty. Off by default; on in the dev profile
    enabled: false
