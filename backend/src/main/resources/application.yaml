spring:
  application:
    name: taskmanagement
  datasource:
    # Keep replicas x maximum-pool-size below Postgres max_connections - ~10
    hikari:
      pool-name: taskmanagement
      maximum-pool-size: 10
  jooq:
    sql-dialect: postgres
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

logging:
  level:
    de.usorov.taskmanagement: INFO
  structured:
    # JSON (ECS) is switched on in deploy/compose.yaml; local runs keep plain text
    ecs:
      service:
        # Container hostname, so lines from different replicas can be told apart
        node-name: ${HOSTNAME:local}

# Actuator runs on its own port, which is never routed publicly
management:
  server:
    port: 9000
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-components: always
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState, db

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  paths-to-match: /api/**
  default-produces-media-type: application/json

app:
  demo-tasks:
    # Adds sample tasks on startup when the database is empty; switch off with APP_DEMO_TASKS_ENABLED=false
    enabled: true
