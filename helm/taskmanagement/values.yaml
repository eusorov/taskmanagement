# Defaults are for a local cluster (minikube) with images built by `docker compose build`.
# For a registry, set image.repository/tag per component and image.pullPolicy: IfNotPresent

backend:
  image:
    repository: taskmanagement-backend
    tag: local
    # Never: the image is loaded into the cluster (minikube image load), not pulled
    pullPolicy: Never
  # Keep replicas x maximum-pool-size (10, application.yaml) below Postgres max_connections (100) - ~10
  replicas: 2
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    # The heap is 75% of this (MaxRAMPercentage in backend/Dockerfile)
    limits:
      memory: 768Mi

frontend:
  image:
    repository: taskmanagement-frontend
    tag: local
    pullPolicy: Never
  replicas: 2
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      memory: 128Mi

# Runs Liquibase once per install/upgrade, before the backend serves the new version (templates/migration-job.yaml)
migration:
  resources:
    requests:
      cpu: 250m
      memory: 384Mi
    limits:
      memory: 768Mi

# nginx's resolver needs the backend's fully qualified name
clusterDomain: cluster.local

# Bitnami PostgreSQL chart (https://github.com/bitnami/charts/tree/main/bitnami/postgresql)
postgresql:
  image:
    # Bitnami's free images are published as `latest` only. Pinned by digest (Postgres 18.6.0) so a new major
    # version can't arrive unannounced: it would fail to start on the existing data. To update, pull
    # bitnami/postgresql:latest, check its version and set the new digest here
    digest: sha256:b418fd5f001c272aad93ac1febf783f543ee45d8e359d58bd5afc3d2a9b62290
  auth:
    username: taskmanagement
    database: taskmanagement
    # No password set: the chart generates one and keeps it in the Secret <release>-postgresql across upgrades.
    # helm uninstall deletes that Secret but keeps the data volume, see README.md
  primary:
    persistence:
      size: 1Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
