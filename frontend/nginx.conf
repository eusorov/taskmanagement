server {
    listen 8080;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Docker's DNS, re-resolved every few seconds so scaled or restarted backends are found
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $backend http://backend:8080;

    location /api/ {
        proxy_pass $backend;
        # The Host as the browser sent it, with the port: the backend builds absolute URLs (Location) from it.
        # $host would drop the port, so the URLs would be wrong whenever FRONTEND_PORT isn't 80
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # nginx is the first hop, so the client's address replaces any X-Forwarded-For the client sent itself
        proxy_set_header X-Forwarded-For $remote_addr;
        # The backend trusts these headers too; empty ones aren't sent, so a client can't set them
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Ssl "";
    }

    # Vite puts a content hash in asset file names, so they can be cached forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Always fetch the latest index.html, which points to the current assets
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Every other path is a page of the single-page app
    location / {
        try_files $uri /index.html;
    }
}
