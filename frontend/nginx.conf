server {
    listen 8080;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Docker's DNS, re-resolved every few seconds so scaled or restarted backends are found
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $backend http://backend:8080;

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite puts a content hash in asset file names, so they can be cached forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Always fetch the latest index.html, which points to the current assets
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Every other path is a page of the single-page app
    location / {
        try_files $uri /index.html;
    }
}
